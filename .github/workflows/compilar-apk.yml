# Forja3D — compila el juego para Android en la nube (GameCI) y publica el APK como Release.
# Lo lanza el conector con la herramienta compilar_apk (o tú desde la pestaña Actions → Run workflow).
name: Compilar APK

on:
  workflow_dispatch:
    inputs:
      nombre_app:
        description: Nombre del juego
        default: Juego Forja3D
      version:
        description: Versión (ej. 0.1.0)
        default: 0.1.0
      formato:
        description: "apk (probar en tu teléfono) o aab (subir a Google Play)"
        type: choice
        options: [apk, aab]
        default: apk

permissions:
  contents: write

concurrency:
  group: compilar-apk-${{ github.ref_name }}
  cancel-in-progress: true

# EXPANSIÓN FUTURA: para PC/iOS/Web, añadir otro job (o una matriz) con targetPlatform
# StandaloneWindows64 / StandaloneLinux64 / WebGL en ubuntu-latest, o iOS / StandaloneOSX en macos-latest,
# y un buildMethod propio en Assets/Editor/Forja3DBuild.cs (ver los comentarios allí).
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Liberar espacio en disco (la imagen de Unity Android es grande)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          tool-cache: false

      - uses: actions/checkout@v4

      - name: Caché de Library (acelera compilaciones siguientes)
        uses: actions/cache@v4
        with:
          path: Library
          # Una caché por rama: varios proyectos pueden vivir en ramas del mismo repo sin mezclarse
          key: Library-Android-v9-${{ github.ref_name }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-v9-${{ github.ref_name }}-

      - name: Datos de la app
        env:
          NOMBRE: ${{ inputs.nombre_app }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p ProjectSettings
          jq -n --arg n "$NOMBRE" --arg v "$VERSION" --argjson c ${{ github.run_number }} \
            '{nombre:$n, version:$v, codigo:$c}' > ProjectSettings/Forja3DApp.json
          cat ProjectSettings/Forja3DApp.json

      - name: Keystore para firmar (solo AAB)
        if: inputs.formato == 'aab'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::[Forja3D] ERROR: faltan los secretos del keystore (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASS, ANDROID_KEYALIAS_NAME, ANDROID_KEYALIAS_PASS)"; exit 1; fi
          echo "$KS" | base64 -d > android.keystore
          echo "android.keystore" >> .git/info/exclude

      - name: Compilar con Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildName: juego
          buildMethod: Forja3DBuild.BuildAndroid
          androidExportType: ${{ inputs.formato == 'aab' && 'androidAppBundle' || 'androidPackage' }}
          customParameters: -formato ${{ inputs.formato || 'apk' }} -keystorePath android.keystore -keystorePass "${{ secrets.ANDROID_KEYSTORE_PASS }}" -keyaliasName "${{ secrets.ANDROID_KEYALIAS_NAME }}" -keyaliasPass "${{ secrets.ANDROID_KEYALIAS_PASS }}"
          versioning: None
          allowDirtyBuild: true

      - name: Buscar el archivo compilado
        id: apk
        run: |
          EXT=${{ inputs.formato == 'aab' && 'aab' || 'apk' }}
          F=$(find build -name "*.$EXT" | head -n 1)
          if [ -z "$F" ]; then echo "::error::[Forja3D] ERROR: no se generó ningún .$EXT"; exit 1; fi
          cp "$F" "juego.$EXT"
          echo "archivo=juego.$EXT" >> "$GITHUB_OUTPUT"
          echo "tam=$(du -h juego.$EXT | cut -f1)" >> "$GITHUB_OUTPUT"
          rm -f android.keystore

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: juego
          path: ${{ steps.apk.outputs.archivo }}
          retention-days: 30

      - name: Publicar Release con el APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "${{ inputs.nombre_app }} v${{ inputs.version }} (compilación ${{ github.run_number }})"
          body: "${{ inputs.formato == 'aab' && 'AAB firmado para Google Play' || 'APK para instalar en tu Android' }} generado por Forja3D (${{ steps.apk.outputs.tam }})."
          files: ${{ steps.apk.outputs.archivo }}
          make_latest: true
